{% extends "blog/base.html" %}

{% block content %}
  <h1>{% if object %}Edit comment{% else %}Add a comment{% endif %}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
  </form>
  <a href="{% if object %}{{ object.post.get_absolute_url }}{% else %}{% url 'post_list' %}{% endif %}">Cancel</a>
{% endblock %}
